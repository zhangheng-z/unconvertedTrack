[project]
name = "unconverted-user-value-mvp"
version = "0.1.0"
description = "MVP backend for the unconverted user value loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.1",
    "pillow>=10.4.0",
    "reportlab>=4.2.2",
    "tzdata>=2025.2",
    "jinja2>=3.1.0",
    "PyJWT>=2.10.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0", "dramatiq[redis]>=1.17.0"]
test = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
