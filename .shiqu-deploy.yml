deployMode: DOCKERFILE
projectRoot: .
containerPorts:
  - 8080
health:
  path: /health
  expectedStatus: 200
  timeoutSeconds: 90
envRequirements:
  - SQLITE_DATABASE_PATH
  - LOCAL_FILE_BASE_URL
  - LOCAL_FILE_ROOT
  - WECHAT_APP_ID
  - WECHAT_APP_SECRET
  - JWT_SECRET_KEY
  - JWT_EXPIRE_DAYS
  - SHARE_UNLOCK_THRESHOLD
  - AI_TOPIC_WINDOW_DAYS
  - VECTORENGINE_BASE_URL
  - VECTORENGINE_API_KEY
  - AI_TEXT_MODEL
  - AI_IMAGE_MODEL
  - AI_GENERATION_TIMEOUT
  - AI_IMAGE_GENERATION_TIMEOUT
  - AI_IMAGE_PDF_MAX_PAGES
